[project]
name = "job-market-map"
version = "0.2.0"
description = "Neutral local job market card collector and API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "playwright>=1.62.0",
  "python-jobspy==1.1.82",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
  'ignore:The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.:DeprecationWarning:starlette\.testclient',
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3",
    "ruff>=0.16.6",
]
